<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Losco — Calendario (spike FullCalendar)</title>
    <link rel="icon" type="image/jpeg" href="/static/LoscoLogo.jpg" />
    <!-- Tema class-based (tokens.css): default según prefers-color-scheme,
       inline antes del CSS para evitar FOUC (mismo patrón que base.html). -->
    <script>
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
