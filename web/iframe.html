<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Losco — Calendario (Chatwoot)</title>
    <link rel="icon" type="image/jpeg" href="/static/LoscoLogo.jpg" />
    <!-- Tema class-based (tokens.css): default según prefers-color-scheme,
       inline antes del CSS para evitar FOUC (mismo patrón que base.html). -->
    <script>
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <!-- html/body/#app a 100%: el shell del calendario llena el iframe de
     * Chatwoot de punta a punta (sin header ni padding, pedido del usuario). -->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/iframe-main.ts"></script>
  </body>
</html>
