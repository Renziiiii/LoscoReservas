<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Losco — Reservas del contacto</title>
  <style>
    :root {
      --bg: #111113;
      --surface: #18191b;
      --border-subtle: #212225;
      --border-strong: #272a2d;
      --text: #edeef0;
      --text-secondary: #b0b4ba;
      --muted: #696e77;
      --accent: #1f93ff;
      --accent-hover: #1976d2;
      --danger: #e54666;
      --danger-bg: #3a141e;
      --warn: #ffc53d;
      --warn-bg: #302008;
      --ok: #12a594;
      --ok-bg: #0d2d2a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { padding: 12px; }
    h2 { font-size: 15px; margin: 0 0 8px; color: var(--text); }
    .espera, .vacia { color: var(--muted); font-size: 13px; }
    .hint { color: var(--warn); font-size: 12px; margin: 8px 0 0; }
    form.editando { border-color: var(--accent); }
    table {
      border-collapse: collapse;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-subtle);
    }
    th { color: var(--text-secondary); font-weight: 600; background: var(--surface); }
    tr:last-child td { border-bottom: none; }
    .estado {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .estado.pendiente { color: var(--warn); background: var(--warn-bg); }
    .estado.confirmada { color: var(--ok); background: var(--ok-bg); }
    .estado.cancelada { color: var(--danger); background: var(--danger-bg); text-decoration: line-through; }
    form {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; color: var(--text-secondary); margin: 8px 0 3px; }
    label.chk { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    input, select {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .fila { display: flex; gap: 8px; }
    .fila > div { flex: 1; }
    button, .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 10px;
      font-size: 13px;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #fff;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
    .btn-cancel {
      width: 100%;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
      text-align: center;
    }
    .btn-cancel:hover { color: var(--text); border-color: var(--text-secondary); }
    .actions { white-space: nowrap; }
    .actions button {
      margin: 0 0 0 4px;
      padding: 3px 6px;
      font-size: 12px;
      background: var(--border-strong);
      color: var(--text-secondary);
    }
    .actions button:hover { color: var(--text); background: var(--border-subtle); }
    .ok { color: var(--ok); font-size: 13px; margin-top: 8px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Reservas</h2>
    <p class="espera" id="estado">Esperando contexto de Chatwoot…</p>

    <form id="form-reserva" style="display:none">
      <div class="fila">
        <div>
          <label for="f-nombre">Nombre</label>
          <input id="f-nombre" name="nombre" maxlength="120">
        </div>
        <div>
          <label for="f-telefono">Teléfono</label>
          <input id="f-telefono" name="telefono" maxlength="32">
        </div>
      </div>
      <div class="fila">
        <div>
          <label for="f-fecha">Fecha</label>
          <input id="f-fecha" name="fecha" type="date" required>
        </div>
        <div>
          <label for="f-hora">Hora</label>
          <input id="f-hora" name="hora" type="time" required>
        </div>
        <div>
          <label for="f-personas">Personas</label>
          <input id="f-personas" name="personas" type="number" min="1" max="200" value="2" required>
        </div>
        <div>
          <label for="f-estado">Estado</label>
          <select id="f-estado" name="estado">
            <option value="pendiente">pendiente</option>
            <option value="confirmada">confirmada</option>
            <option value="cancelada">cancelada</option>
          </select>
        </div>
      </div>
      <label for="f-detalles">Detalles</label>
      <input id="f-detalles" name="detalles" maxlength="2000" placeholder="Mesa adentro, cumpleaños…">
      <label class="chk"><input type="checkbox" id="f-recordatorio" name="enviar_recordatorio" checked> Enviar recordatorios de WhatsApp</label>
      <p class="hint" id="edit-hint" style="display:none">✏️ Estás editando una reserva existente — al guardar se reemplazan sus datos</p>
      <button type="submit" id="f-submit">Registrar reserva</button>
      <button type="submit" id="f-submit-edit" style="display:none">Guardar cambios</button>
      <a href="javascript:void(0)" id="f-cancel" class="btn btn-cancel" style="display:none">Cancelar</a>
      <p class="ok" id="form-ok" style="display:none"></p>
      <p class="err" id="form-err" style="display:none"></p>
    </form>

    <div id="contenido"></div>
  </div>
  <script>
    // Chatwoot Dashboard Apps deliver the conversation/contact context as a
    // window message. Per the official docs the payload arrives as a JSON
    // STRING, so it must be parsed; object payloads are accepted too.
    // On load we also ask for the context on demand in case Chatwoot already
    // sent it before this listener was attached.
    const key = new URLSearchParams(window.location.search).get("key") || "";

    window.parent.postMessage("chatwoot-dashboard-app:fetch-info", "*");

    let telActual = "";
    let contactName = "";
    let contactPhone = "";
    let editingId = null;

    window.addEventListener("message", (event) => {
      let data = event.data;
      if (typeof data === "string") {
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          return; // not a JSON message meant for us
        }
      }
      if (!data || data.event !== "appContext" || !data.data) return;
      const contact = data.data.contact || {};
      const tel = contact.phone_number || contact.phone || "";
      if (!tel) {
        document.getElementById("estado").textContent =
          "El contacto no tiene teléfono cargado en Chatwoot.";
        return;
      }
      telActual = tel;
      contactName = contact.name || "";
      contactPhone = tel;
      document.getElementById("form-reserva").style.display = "block";
      modoCrear();
      cargarReservas();
    });

    function modoCrear() {
      const form = document.getElementById("form-reserva");
      form.reset();
      form.classList.remove("editando");
      document.getElementById("f-nombre").value = contactName;
      document.getElementById("f-telefono").value = contactPhone;
      document.getElementById("f-personas").value = "2";
      document.getElementById("f-estado").value = "pendiente";
      document.getElementById("f-recordatorio").checked = true;
      document.getElementById("f-submit").style.display = "block";
      document.getElementById("f-submit-edit").style.display = "none";
      document.getElementById("f-cancel").style.display = "none";
      document.getElementById("edit-hint").style.display = "none";
      document.getElementById("form-ok").style.display = "none";
      document.getElementById("form-err").style.display = "none";
      editingId = null;
    }

    function modoEditar(reserva) {
      const form = document.getElementById("form-reserva");
      form.classList.add("editando");
      document.getElementById("f-nombre").value = reserva.nombre;
      document.getElementById("f-telefono").value = reserva.telefono;
      document.getElementById("f-fecha").value = reserva.fecha;
      document.getElementById("f-hora").value = reserva.hora;
      document.getElementById("f-personas").value = String(reserva.personas);
      document.getElementById("f-estado").value = reserva.estado;
      document.getElementById("f-detalles").value = reserva.detalles || "";
      document.getElementById("f-recordatorio").checked = reserva.enviar_recordatorio !== false;
      document.getElementById("f-submit").style.display = "none";
      document.getElementById("f-submit-edit").style.display = "block";
      document.getElementById("f-cancel").style.display = "inline-block";
      document.getElementById("edit-hint").style.display = "block";
      document.getElementById("form-ok").style.display = "none";
      document.getElementById("form-err").style.display = "none";
      editingId = reserva.id;
    }

    document.getElementById("f-cancel").addEventListener("click", (e) => {
      e.preventDefault();
      modoCrear();
    });

    function cargarReservas() {
      document.getElementById("estado").textContent = "Cargando reservas…";
      fetch("/iframe/reservas.json?tel=" + encodeURIComponent(telActual) + "&key=" + encodeURIComponent(key))
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then((reservas) => renderTabla(reservas))
        .catch(() => {
          document.getElementById("estado").textContent =
            "No se pudieron cargar las reservas.";
        });
    }

    function renderTabla(reservas) {
      const estado = document.getElementById("estado");
      const contenido = document.getElementById("contenido");
      if (!reservas.length) {
        estado.textContent = "Sin reservas para este contacto.";
        contenido.innerHTML = "";
        return;
      }
      estado.textContent = "";
      const filas = reservas.map((r) => `
        <tr data-id="${r.id}" data-reserva="${esc(JSON.stringify(r))}">
          <td>${fechaAr(r.fecha)}</td>
          <td>${r.hora}</td>
          <td>${r.personas}</td>
          <td><span class="estado ${esc(r.estado)}">${esc(r.estado)}</span></td>
          <td>${esc(r.detalles || "")}</td>
          <td class="actions">
            <button type="button" data-edit="${r.id}" aria-label="Editar">✏️</button>
            <button type="button" data-delete="${r.id}" aria-label="Eliminar">🗑</button>
          </td>
        </tr>`).join("");
      contenido.innerHTML = `
        <table>
          <tr><th>Fecha</th><th>Hora</th><th>Personas</th><th>Estado</th><th>Detalles</th><th></th></tr>
          ${filas}
        </table>`;
    }

    document.getElementById("contenido").addEventListener("click", (e) => {
      // Only the row action buttons trigger edit/delete — clicking a cell
      // (or anything else) must do nothing.
      const btn = e.target.closest("button[data-edit], button[data-delete]");
      if (!btn) return;
      e.preventDefault();
      if (btn.dataset.delete) {
        eliminarReserva(parseInt(btn.dataset.delete, 10));
        return;
      }
      const id = parseInt(btn.dataset.edit, 10);
      const fila = document.querySelector(`tr[data-id="${id}"]`);
      if (!fila) return;
      const reserva = JSON.parse(fila.dataset.reserva);
      modoEditar(reserva);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function eliminarReserva(id) {
      const fila = document.querySelector(`tr[data-id="${id}"]`);
      const fecha = fila ? fila.getElementsByTagName("td")[0].textContent.trim() : "";
      if (!window.confirm("¿Eliminar la reserva del " + fecha + "?")) return;
      fetch("/iframe/reservas/" + id + ".json?key=" + encodeURIComponent(key), {
        method: "DELETE",
      })
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          cargarReservas();
          if (editingId === id) modoCrear();
        })
        .catch(() => {
          const err = document.getElementById("form-err");
          err.textContent = "No se pudo eliminar la reserva.";
          err.style.display = "block";
        });
    }

    document.getElementById("form-reserva").addEventListener("submit", (e) => {
      e.preventDefault();
      const elOk = document.getElementById("form-ok");
      const elErr = document.getElementById("form-err");
      elOk.style.display = "none";
      elErr.style.display = "none";
      const boton = editingId
        ? document.getElementById("f-submit-edit")
        : document.getElementById("f-submit");
      boton.disabled = true;

      const body = {
        nombre: document.getElementById("f-nombre").value.trim(),
        telefono: document.getElementById("f-telefono").value.trim(),
        fecha: document.getElementById("f-fecha").value,
        hora: document.getElementById("f-hora").value,
        personas: parseInt(document.getElementById("f-personas").value, 10),
        estado: document.getElementById("f-estado").value,
        detalles: document.getElementById("f-detalles").value.trim() || null,
        enviar_recordatorio: document.getElementById("f-recordatorio").checked,
      };

      const url = editingId
        ? "/iframe/reservas/" + editingId + ".json?key=" + encodeURIComponent(key)
        : "/iframe/reservas.json?key=" + encodeURIComponent(key);
      const method = editingId ? "PATCH" : "POST";

      fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
        .then((r) => r.json().then((data) => ({ ok: r.ok, status: r.status, data })))
        .then(({ ok: respOk, status, data }) => {
          if (!respOk) {
            const detalle = Array.isArray(data.detail)
              ? data.detail.map((d) => (d.msg || "") + (d.loc ? " (" + d.loc.join(".") + ")" : "")).join("; ")
              : (data.detail || "error " + status);
            throw new Error(detalle);
          }
          const msg = editingId
            ? "Cambios guardados para " + fechaAr(data.fecha) + " " + data.hora + "."
            : "Reserva registrada para " + fechaAr(data.fecha) + " " + data.hora + ".";
          modoCrear();
          cargarReservas();
          elOk.textContent = msg;
          elOk.style.display = "block";
        })
        .catch((e) => {
          elErr.textContent = editingId
            ? "No se pudieron guardar los cambios: " + e.message
            : "No se pudo registrar: " + e.message;
          elErr.style.display = "block";
        })
        .finally(() => { boton.disabled = false; });
    });

    // --- helpers ---
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
    function fechaAr(iso) {
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }
    function invertirFecha(texto) {
      const [d, m, y] = texto.split("/");
      return `${y}-${m}-${d}`;
    }
  </script>
</body>
</html>
